name: Build 100 unique Classic crosswords
on:
  # Classic is an editorially approved library, not a daily procedural feed.
  # Never silently replace its 100 solutions or 1,000 authored clues.
  workflow_dispatch:
    inputs:
      confirm_replacement:
        description: 'I approve replacing the Classic solution library and resetting affected puzzle progress'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: build-classic-library
  cancel-in-progress: false
jobs:
  generate:
    if: ${{ inputs.confirm_replacement == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install vocabulary tools
        run: pip install textblob==0.18.0.post0 cmudict==1.1.3
      - name: Generate checked non-repeating answer grids and clues
        run: python scripts/build_classics.py
      - name: Require individually approved clues before replacing the library
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          puzzles=json.loads(Path('data/classics100.json').read_text())
          reviewed=json.loads(Path('data/classic-curated-fallbacks.json').read_text())
          missing=sorted(set(w for p in puzzles for w in p['answers'])-set(reviewed))
          if missing:
              raise SystemExit(
                  f"Editorial approval required for {len(missing)} answers; "
                  "refusing to publish dictionary-generated clues. "
                  "Sample: "+', '.join(missing[:15])
              )
          for p in puzzles:
              for word,clue,hint in zip(p['answers'],p['clues'],p['hints']):
                  if [clue,hint] != reviewed[word]:
                      raise SystemExit(f"Unapproved wording for {word}")
          print('All 1000 answer clues and hints are approved.')
          PY
      - name: Validate every answer, clue, hint and crossing before publishing
        run: node scripts/check_v13.js
      - name: Publish updated puzzle library
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Generated JSON must be committed atop the newest remote main.
          # Reset the commit pointer, not the working files, to avoid a rebase
          # conflict when another publishing run updated the same JSON.
          git fetch origin main
          git reset --mixed origin/main
          git add data/classics100.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish 100 Classic minis with 1000 unique answer words'
            git push origin main
          fi
