name: Update daily headline crossword
on:
  schedule:
    - cron: '17 6 * * *'
    - cron: '17 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_news.py'
      - '.github/workflows/daily-news.yml'
permissions:
  contents: write
concurrency:
  group: publish-daily-news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build today's crossword from multiple news feeds
        run: |
          python -m py_compile scripts/build_news.py
          python scripts/build_news.py
      - name: Publish verified edition to GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test -f data/news.json; then
            git add data/news.json
            if test -f data/news-history.json; then git add data/news-history.json; fi
            if ! git diff --cached --quiet; then
              git commit -m 'Publish multi-source daily news crossword'
              git pull --rebase origin main
              git push origin main
            else
              echo 'Edition unchanged — nothing to publish'
            fi
          else
            echo 'No current matching headlines; offline Newsroom mini stays available'
          fi
